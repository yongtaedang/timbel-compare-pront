# timbel-compare-front(정적 export) nginx 설정.
#
# - 화면이 한 장뿐이라 라우팅이랄 게 거의 없다. try_files가 $uri.html까지 보고, 없으면 404.
# - API 호출은 브라우저가 timbel-compare-api로 직접 보낸다 — 여기서 프록시하지 않는다.
#   따라서 CORS는 API 쪽 CORS_ALLOWED_ORIGINS가 처리한다.
# - TLS/HSTS는 앞단(리버스 프록시/인그레스)이 종단한다(docs/deploy-guide.md).

server {
    # 홈포트 앱 포트와 같은 3000에서 받는다(Dockerfile의 EXPOSE와 일치해야 한다).
    listen 3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    include /etc/nginx/snippets/nginx-security-headers.conf;

    location / {
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/nginx-security-headers.conf;
        try_files $uri $uri.html $uri/ =404;
    }

    # 파일명에 콘텐츠 해시가 들어가는 자산 — 안전하게 장기 캐시한다.
    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/snippets/nginx-security-headers.conf;
    }

    # HTML/텍스트 응답은 no-cache — 재배포 후 옛 셸이 남아 해시가 바뀐 청크를 404로 물지 않게 한다.
    location ~* \.(html|txt)$ {
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/nginx-security-headers.conf;
    }

    error_page 403 =404 /404.html;
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
