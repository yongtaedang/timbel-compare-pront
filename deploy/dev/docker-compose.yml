# VM에서 git pull 뒤 이 파일로 띄운다(docs/deploy-guide.md).
#   docker compose -f deploy/dev/docker-compose.yml up -d --build
#
# NEXT_PUBLIC_API_URL은 런타임 env가 아니라 **빌드 인자**다 — .env.dev/.env.prd 중 어느
# 프로필로 빌드했는지가 곧 API 주소다. 주소를 바꾸려면 파일을 고치고 다시 빌드해야 한다.
services:
  front:
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        BUILD_PROFILE: prd
    image: timbel-compare-front:local
    restart: unless-stopped
    ports:
      - "3000:3000"
